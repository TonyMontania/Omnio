<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Omnio — local-first hobby tracker">
  <defs>
    <!-- Background: near-black with a subtle warm-gold radial glow behind the wordmark,
         so the star reads as a light source rather than a floating sticker. -->
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#22201b"/>
      <stop offset="0.5" stop-color="#17181c"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c04a"/>
      <stop offset="1" stop-color="#a8791b"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d76a"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d76a"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>

    <!-- Category glyphs — one <symbol> per unique icon, then <use> per
         library. Every glyph draws inside a 32×32 viewport, centered on
         (16,16), stroked with `currentColor` so the parent <use fill/stroke>
         paints them in the app's gold. Consistent stroke-width, cap and
         join keep the whole strip visually cohesive. -->
    <symbol id="i-controller" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 12h14a5 5 0 0 1 5 5v4a4 4 0 0 1-7 2.6L20 22h-8l-1 1.6A4 4 0 0 1 4 21v-4a5 5 0 0 1 5-5z"/>
        <path d="M10.5 16v3M9 17.5h3M21 17h.01M23 17h.01M22 16h.01M22 18h.01"/>
      </g>
    </symbol>
    <symbol id="i-cassette" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="8" width="25" height="16" rx="2"/>
        <circle cx="11" cy="16" r="2"/>
        <circle cx="21" cy="16" r="2"/>
        <path d="M13 16h6"/>
        <path d="M8 22l2-2.5M24 22l-2-2.5"/>
      </g>
    </symbol>
    <symbol id="i-clapper" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h24v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
        <path d="M4 12l1.3-5 5-1.3 1.3 5M10.6 10.7l1.3-5 5-1.3 1.3 5M17.2 10.7l1.3-5 5-1.3 1.3 5"/>
      </g>
    </symbol>
    <symbol id="i-tv" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="24" height="15" rx="2"/>
        <path d="M11 5l5 4 5-4"/>
        <path d="M11 29h10"/>
      </g>
    </symbol>
    <symbol id="i-play" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="24" height="20" rx="2.5"/>
      </g>
      <path d="M13 12l7 4-7 4z" fill="currentColor"/>
    </symbol>
    <!-- Manga family — four visually distinct glyphs so the strip doesn't
         read as four identical cells with only labels distinguishing them.
         The metaphors pick the reading format each tradition is best known
         for today: manga = printed page grid, manhwa = vertical webtoon
         scroll (Korean market went mobile-first years ago), manhua = 3-column
         horizontal panel strip (echoes classic Chinese lianhuanhua), comics =
         single panel with a speech bubble (Western archetype). -->
    <symbol id="i-manga" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="5" width="10" height="10"/>
        <rect x="17" y="5" width="10" height="10"/>
        <rect x="5" y="17" width="10" height="10"/>
        <rect x="17" y="17" width="10" height="10"/>
      </g>
    </symbol>
    <symbol id="i-manhwa" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="3" width="12" height="26" rx="1"/>
        <path d="M10 10h12M10 16h12M10 22h12"/>
      </g>
    </symbol>
    <symbol id="i-manhua" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="7" height="20" rx="0.5"/>
        <rect x="12.5" y="6" width="7" height="20" rx="0.5"/>
        <rect x="21" y="6" width="7" height="20" rx="0.5"/>
      </g>
    </symbol>
    <symbol id="i-comics" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="24" height="20" rx="1"/>
        <ellipse cx="21" cy="14" rx="5" ry="4"/>
        <path d="M18 17l-2 2.5 0.8-3.5"/>
      </g>
    </symbol>
    <symbol id="i-book" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 7h8a2.5 2.5 0 0 1 2.5 2.5v17.5a2.5 2.5 0 0 0-2.5-2.5H5z"/>
        <path d="M27 7h-8a2.5 2.5 0 0 0-2.5 2.5v17.5a2.5 2.5 0 0 1 2.5-2.5h8z"/>
        <path d="M16 9.5v17.5"/>
      </g>
    </symbol>
  </defs>

  <!-- Base -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Logo mark -->
  <g transform="translate(640, 190)">
    <circle cx="0" cy="0" r="86" fill="none" stroke="url(#ring)" stroke-width="10"/>
    <path d="M0 -74 L14 -14 L74 0 L14 14 L0 74 L-14 14 L-74 0 L-14 -14 Z" fill="url(#star)"/>
    <circle cx="0" cy="0" r="10" fill="#0e0f12"/>
  </g>

  <!-- Wordmark -->
  <text
    x="640"
    y="410"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="140"
    font-weight="700"
    letter-spacing="-2"
    fill="url(#wordmark)"
  >Omnio</text>

  <!-- Tagline -->
  <text
    x="640"
    y="465"
    text-anchor="middle"
    font-family="'Consolas', 'Menlo', 'Courier New', monospace"
    font-size="20"
    letter-spacing="6"
    fill="#c9a227"
  >LOCAL-FIRST HOBBY TRACKER</text>

  <!-- Category strip: eleven cells, 96 units wide each, centered.
       Icon on top (32×32), label below in gold-tinted mono.
       Manga family and Anime/Donghua reuse their shared glyphs — the
       label is what distinguishes them. `color` on the <g> paints
       through to `currentColor` inside each <use>d symbol. -->
  <g color="#c9a227" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="12" letter-spacing="0.5" text-anchor="middle" fill="#b09a5a">
    <!-- 11 cells × 96px = 1056px; left margin = (1280-1056)/2 = 112.
         Cell centers at 112 + 48 + i*96 = 160, 256, 352, 448, 544, 640, 736, 832, 928, 1024, 1120 -->
    <g transform="translate(144, 520)"><use href="#i-controller" width="32" height="32"/><text x="16" y="52">Games</text></g>
    <g transform="translate(240, 520)"><use href="#i-cassette"   width="32" height="32"/><text x="16" y="52">Music</text></g>
    <g transform="translate(336, 520)"><use href="#i-clapper"    width="32" height="32"/><text x="16" y="52">Movies</text></g>
    <g transform="translate(432, 520)"><use href="#i-tv"         width="32" height="32"/><text x="16" y="52">Series</text></g>
    <g transform="translate(528, 520)"><use href="#i-play"       width="32" height="32"/><text x="16" y="52">Anime</text></g>
    <g transform="translate(624, 520)"><use href="#i-play"       width="32" height="32"/><text x="16" y="52">Donghua</text></g>
    <g transform="translate(720, 520)"><use href="#i-manga"      width="32" height="32"/><text x="16" y="52">Manga</text></g>
    <g transform="translate(816, 520)"><use href="#i-manhwa"     width="32" height="32"/><text x="16" y="52">Manhwa</text></g>
    <g transform="translate(912, 520)"><use href="#i-manhua"     width="32" height="32"/><text x="16" y="52">Manhua</text></g>
    <g transform="translate(1008, 520)"><use href="#i-comics"    width="32" height="32"/><text x="16" y="52">Comics</text></g>
    <g transform="translate(1104, 520)"><use href="#i-book"      width="32" height="32"/><text x="16" y="52">Books</text></g>
  </g>
</svg>
