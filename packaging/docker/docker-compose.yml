# Omnio — headless (KasmVNC) deployment.
#
# From this folder:    docker compose up -d
# Open:                http://localhost:3000
#
# Default pulls the published image from GitHub Container Registry — no
# clone or Node toolchain needed on the host. To build from local source
# instead (dev / bisecting), comment out `image:` and uncomment `build:`.

services:
  omnio:
    container_name: omnio
    image: ghcr.io/tonymontania/omnio:latest
    # build:
    #   context: ../..
    #   dockerfile: packaging/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"   # HTTP  (KasmVNC web UI)
      - "3001:3001"   # HTTPS (self-signed)
    environment:
      # Passed through to the linuxserver base. Match to your host so
      # /config files are owned by you and not root.
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # Optional login for the KasmVNC web UI. Leave unset for no auth
      # (fine on a home LAN; set both when exposing to the internet).
      # - CUSTOM_USER=admin
      # - PASSWORD=changeme
    volumes:
      # Your entire library — data/ (JSONs + backups) and assets/ (covers,
      # banners, save files, screenshots) live under this one folder so
      # backing up Omnio is one `cp -r`.
      - ./omnio-config:/config
    shm_size: "1gb"
