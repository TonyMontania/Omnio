ShortDescription: Local-first hobby tracker for games, music, movies, series, anime and books.
Description: |-
  Omnio is a local desktop app to track every hobby you follow — games, music,
  movies, series, anime, donghua, manga family, books and visual novels — in
  one place. No accounts, no cloud, no telemetry. Your library lives in a
  data/ folder you own. One-click metadata + covers from 13 sources
  (IGDB / TMDb / AniList / VNDB / MangaDex / MusicBrainz / OpenLibrary / …).
