# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json

# Installer manifest — one entry per artifact + architecture. NSIS is
# the recommended default; MSI stays alongside for group-policy /
# unattended-install scenarios (SCCM, Intune…). Portable ZIP is
# published as a `portable` installer type.

PackageIdentifier: TonyMontania.Omnio
PackageVersion: @VERSION@

Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.19041.0
InstallModes:
  - interactive
  - silent
  - silentWithProgress

Installers:
  - InstallerType: nullsoft
    Architecture: x64
    InstallerUrl: https://github.com/TonyMontania/Omnio/releases/download/v@VERSION@/Omnio_@VERSION@_x64-setup.exe
    InstallerSha256: @SHA256_NSIS_X64@
    Scope: user
    InstallerSwitches:
      Silent: /S
      SilentWithProgress: /S
      Custom: /S
    UpgradeBehavior: install
    ReleaseDate: @RELEASE_DATE@

  - InstallerType: wix
    Architecture: x64
    InstallerUrl: https://github.com/TonyMontania/Omnio/releases/download/v@VERSION@/Omnio_@VERSION@_x64_en-US.msi
    InstallerSha256: @SHA256_MSI_X64@
    Scope: machine
    InstallerSwitches:
      Silent: /qn
      SilentWithProgress: /qb
    UpgradeBehavior: install
    ReleaseDate: @RELEASE_DATE@

  - InstallerType: portable
    Architecture: x64
    InstallerUrl: https://github.com/TonyMontania/Omnio/releases/download/v@VERSION@/Omnio_@VERSION@_windows-portable.zip
    InstallerSha256: @SHA256_PORTABLE_X64@
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: omnio.exe
        PortableCommandAlias: omnio
    UpgradeBehavior: install
    ReleaseDate: @RELEASE_DATE@

ManifestType: installer
ManifestVersion: 1.6.0
