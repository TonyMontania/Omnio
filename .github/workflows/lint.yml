# Lint gate — runs on every push and PR against main. Zero warnings,
# zero errors (matches the local `npm run lint` gate). Kept in its own
# workflow so a lint failure blocks the merge visibly without also
# spinning up the full release build.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
