# Unit tests — runs Vitest on every push to main and every PR. Fast:
# only tests pure-logic utilities (parseCsv, formatIsoDate, buildCsv,
# etc), no DOM, no Electron. Kept separate from smoke.yml so this can
# fail-fast on a broken util without waiting for the Playwright boot.

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm test
