# Cross-platform release build.
#
# Trigger: push a semver tag `v*`. Builds the Tauri desktop app on
# Windows, macOS (arm64 + x64), and Linux, then uploads every
# installer to a GitHub Release named after the tag.
#
# The matrix produces:
#   * Windows: `Omnio_<version>_x64-setup.exe`      (NSIS installer)
#              `Omnio_<version>_x64_en-US.msi`      (MSI installer)
#              `Omnio_<version>_windows-portable.zip` (portable EXE)
#   * macOS:   `Omnio_<version>_aarch64.dmg`
#              `Omnio_<version>_x64.dmg`
#   * Linux:   `omnio_<version>_amd64.AppImage`
#              `omnio_<version>_amd64.deb`
#              `omnio-<version>-1.x86_64.rpm`
#
# A follow-up `package-channels` job stamps the AUR PKGBUILD + winget
# manifests under `packaging/` with the release version + real SHA256s
# and uploads them as extra release assets. Downstream automation
# (submit to AUR, PR to microsoft/winget-pkgs) picks up from there.
#
# The in-app updater (`updates:check` → `updates:install-kind`)
# matches assets on filename suffix (`-setup.exe`, `aarch64.dmg`,
# `x64.dmg`, `.AppImage`, `.deb`, `.rpm`, `windows-portable.zip`), so
# Tauri's default names Just Work with the existing GitHub Releases
# assisted-download flow. Nothing here is signed — Windows SmartScreen
# and macOS Gatekeeper warn on first launch. Documented in the README.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit target on macOS lets us cross-compile arm64 from
          # the same x64 runner (or the reverse). Ubuntu and Windows
          # use the runner's default host triple.
          targets: ${{ matrix.platform == 'macos-latest' && (contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Cache Cargo registry + build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Extract the changelog section for this tag from CHANGELOG.md and
      # feed it to `tauri-action` as the `releaseBody` string. tauri-action
      # does NOT accept a `releaseBodyPath`, so we have to read the file
      # into a multiline GitHub Actions output. Falls back to an empty
      # body (which lets tauri-action write its own default) if the
      # section isn't found.
      - name: Extract release notes for this tag
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          file="release-notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$tag" '
              BEGIN { inside = 0 }
              /^## / {
                if (inside) { exit }
                if ($2 == tag || $2 ~ "^" tag "([^0-9]|$)") { inside = 1; next }
              }
              inside { print }
            ' CHANGELOG.md > "$file"
          else
            : > "$file"
          fi
          bytes=$(wc -c < "$file" | tr -d ' ')
          echo "Extracted $bytes bytes of release notes for $tag"
          # Multi-line output via heredoc — the delimiter has to be
          # unique inside the payload, so use a random-enough marker.
          {
            echo "body<<OMNIO_RELEASE_NOTES_EOF"
            cat "$file"
            echo "OMNIO_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            rpm

      - name: npm install
        run: npm ci

      - name: Renderer smoke build
        run: npm run renderer:build
        # tauri-action below runs its own vite build as part of the
        # bundle pipeline. This extra step is a smoke test that
        # tsc + vite bundle cleanly before we start the (much longer)
        # cargo build. Uses `renderer:build` (tsc && vite build) —
        # `npm run build` now delegates to `tauri build` and would
        # double-compile.

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          # Release title is just the version tag ("v0.5.3", "v0.6.0",
          # …) — no "Omnio " prefix. Repo context already makes it clear
          # which app the release belongs to.
          releaseName: ${{ github.ref_name }}
          # `releaseBody` (a string) — tauri-action does NOT accept a
          # `releaseBodyPath` param, so we inline the extracted CHANGELOG
          # section from `steps.notes` above. The output was set via a
          # multiline heredoc, so this expands to the full markdown body.
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri v2's AppImage bundler ships without the executable bit on
      # `AppRun.wrapped`. Firejail-based launchers (Ubuntu's default) hit
      # `Permission denied` and the app never opens a window. Rebuild the
      # AppImage locally with the exec bits set so downstream catalogs
      # (probonopd/AppImages, appimage.github.io) accept it. Also chown
      # AppRun / AppRun.wrapped inside the squashfs so no user-side
      # firejail rewrite is needed.
      - name: Repack AppImage with executable bits
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1 || true)
          if [ -z "$appimage" ]; then
            echo "No AppImage found — skipping repack."
            exit 0
          fi
          echo "Repacking $appimage"
          # Grab a fresh appimagetool. The one in target/ is bundled by
          # Tauri but sometimes gets stale between runs.
          curl -fsSL -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool

          workdir=$(mktemp -d)
          cp "$appimage" "$workdir/original.AppImage"
          chmod +x "$workdir/original.AppImage"
          pushd "$workdir" > /dev/null
          ./original.AppImage --appimage-extract > /dev/null
          # Set exec on every launcher script + the main binary. Belt-and-
          # suspenders: match all common launcher shapes so future Tauri
          # bundler tweaks don't silently un-fix this.
          for f in squashfs-root/AppRun squashfs-root/AppRun.wrapped squashfs-root/usr/bin/*; do
            if [ -f "$f" ]; then chmod +x "$f"; fi
          done
          rm -f original.AppImage
          # Repack — `--appimage-extract-and-run` avoids needing FUSE.
          /tmp/appimagetool --appimage-extract-and-run squashfs-root repacked.AppImage
          popd > /dev/null
          cp "$workdir/repacked.AppImage" "$appimage"
          chmod +x "$appimage"
          echo "Repacked → $appimage"
          ls -la "$appimage"

      - name: Re-upload fixed AppImage to release
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1 || true)
          if [ -z "$appimage" ]; then
            echo "No AppImage to upload."
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" "$appimage" \
            --repo "${{ github.repository }}" --clobber

      # Tauri v2 doesn't produce a single-file portable EXE like
      # electron-builder did. Ship the raw binary as a zip alongside
      # the installers — needs WebView2 on the host (installed by
      # default on Windows 10 21H2+ and every Windows 11).
      - name: Package Windows portable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $exe = "src-tauri\target\release\omnio.exe"
          $zip = "Omnio_${version}_windows-portable.zip"
          if (-not (Test-Path $exe)) {
            Write-Error "omnio.exe not found at $exe"
            exit 1
          }
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          $size = (Get-Item $zip).Length
          Write-Host "Created: $zip ($size bytes)"

      - name: Upload Windows portable to release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "Omnio_${version}_windows-portable.zip" \
            --repo "${{ github.repository }}" --clobber

  # Stamp the AUR + winget manifests with the release version + real
  # SHA256s pulled from the freshly-uploaded assets, then upload the
  # stamped files back to the release. Runs after every matrix build
  # completes so the assets are guaranteed to exist.
  package-channels:
    needs: build-tauri
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Stamp packaging manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p stamped
          node scripts/stamp-packaging.mjs \
            --version "$version" \
            --assets-dir release-assets \
            --out stamped

      # The stamped AUR PKGBUILD + winget YAMLs are maintainer artifacts:
      # they're the input to `git push` (AUR) or `wingetcreate submit`
      # (winget-pkgs), NOT files a normal user should ever download. We
      # store them as workflow artifacts so the maintainer can grab them
      # from the Actions tab when they're ready to submit, without
      # cluttering the Release page for end users.
      - name: Upload stamped manifests as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: packaging-manifests-${{ github.ref_name }}
          path: |
            stamped/aur/PKGBUILD
            stamped/winget/TonyMontania.Omnio.yaml
            stamped/winget/TonyMontania.Omnio.installer.yaml
            stamped/winget/TonyMontania.Omnio.locale.en-US.yaml
          retention-days: 90
