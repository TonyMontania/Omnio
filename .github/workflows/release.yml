# Cross-platform release build.
#
# Trigger: push a semver tag `v*`. Builds the Tauri desktop app on
# Windows, macOS (arm64 + x64), and Linux, then uploads every
# installer to a GitHub Release named after the tag.
#
# The matrix produces:
#   * Windows: `Omnio_<version>_x64-setup.exe` (NSIS installer)
#              `Omnio_<version>_x64_en-US.msi` (MSI installer)
#   * macOS:   `Omnio_<version>_aarch64.dmg`
#              `Omnio_<version>_x64.dmg`
#   * Linux:   `omnio_<version>_amd64.AppImage`
#              `omnio_<version>_amd64.deb`
#
# The in-app updater (`updates:check` → `updates:install-kind`)
# matches assets on filename suffix (`-setup.exe`, `aarch64.dmg`,
# `x64.dmg`, `.AppImage`), so Tauri's default names Just Work with
# the existing GitHub Releases assisted-download flow. Nothing here
# is signed — Windows SmartScreen and macOS Gatekeeper warn on first
# launch. Documented in the README.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit target on macOS lets us cross-compile arm64 from
          # the same x64 runner (or the reverse). Ubuntu and Windows
          # use the runner's default host triple.
          targets: ${{ matrix.platform == 'macos-latest' && (contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Cache Cargo registry + build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Extract the changelog section for this tag from CHANGELOG.md.
      # The section header is `## v<version>` (matching the tag). Every
      # matrix job does this — cheap, keeps the release body consistent
      # across platforms. tauri-action would otherwise use its own generic
      # `releaseBody` string, which is what we're replacing.
      - name: Extract release notes for this tag
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          file=".github/release-notes.md"
          if [ -f CHANGELOG.md ]; then
            # Pull everything between `## <tag>` (inclusive of blank line
            # after the heading) and the next `## v` heading. If nothing
            # matches, we leave the file empty and tauri-action will fall
            # back to its default text.
            awk -v tag="$tag" '
              BEGIN { inside = 0 }
              /^## / {
                if (inside) { exit }
                if ($2 == tag || $2 ~ "^" tag "([^0-9]|$)") { inside = 1; next }
              }
              inside { print }
            ' CHANGELOG.md > "$file"
          else
            : > "$file"
          fi
          bytes=$(wc -c < "$file" | tr -d ' ')
          echo "Extracted $bytes bytes of release notes for $tag"
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: npm install
        run: npm ci

      - name: Renderer smoke build
        run: npm run renderer:build
        # tauri-action below runs its own vite build as part of the
        # bundle pipeline. This extra step is a smoke test that
        # tsc + vite bundle cleanly before we start the (much longer)
        # cargo build. Uses `renderer:build` (tsc && vite build) —
        # `npm run build` now delegates to `tauri build` and would
        # double-compile.

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Omnio ${{ github.ref_name }}'
          releaseBodyPath: ${{ steps.notes.outputs.path }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri v2 doesn't produce a single-file portable EXE like
      # electron-builder did. Ship the raw binary as a zip alongside
      # the installers — needs WebView2 on the host (installed by
      # default on Windows 10 21H2+ and every Windows 11).
      - name: Package Windows portable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $exe = "src-tauri\target\release\omnio.exe"
          $zip = "Omnio_${version}_windows-portable.zip"
          if (-not (Test-Path $exe)) {
            Write-Error "omnio.exe not found at $exe"
            exit 1
          }
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          $size = (Get-Item $zip).Length
          Write-Host "Created: $zip ($size bytes)"

      - name: Upload Windows portable to release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "Omnio_${version}_windows-portable.zip" \
            --repo "${{ github.repository }}" --clobber
