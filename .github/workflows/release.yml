# Cross-platform release build.
#
# Trigger: push a semver tag `v*`. Builds the Tauri desktop app on
# Windows, macOS (arm64 + x64), and Linux, then uploads every
# installer to a GitHub Release named after the tag.
#
# The matrix produces:
#   * Windows: `Omnio_<version>_x64-setup.exe` (NSIS installer)
#              `Omnio_<version>_x64_en-US.msi` (MSI installer)
#   * macOS:   `Omnio_<version>_aarch64.dmg`
#              `Omnio_<version>_x64.dmg`
#   * Linux:   `omnio_<version>_amd64.AppImage`
#              `omnio_<version>_amd64.deb`
#
# The in-app updater (`updates:check` → `updates:install-kind`)
# matches assets on filename suffix (`-setup.exe`, `aarch64.dmg`,
# `x64.dmg`, `.AppImage`), so Tauri's default names Just Work with
# the existing GitHub Releases assisted-download flow. Nothing here
# is signed — Windows SmartScreen and macOS Gatekeeper warn on first
# launch. Documented in the README.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit target on macOS lets us cross-compile arm64 from
          # the same x64 runner (or the reverse). Ubuntu and Windows
          # use the runner's default host triple.
          targets: ${{ matrix.platform == 'macos-latest' && (contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Cache Cargo registry + build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: npm install
        run: npm ci

      - name: Build renderer
        run: npm run build --if-present
        # tauri-action below runs its own vite build as part of the
        # bundle pipeline. This extra step is a smoke test that the
        # renderer bundles cleanly before we start the (much longer)
        # cargo build.

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `tagName` + `releaseName` here fill in the same Release
          # that release.yml also uploads to — the tauri-action reuses
          # the tag if one already exists. `releaseDraft: false` +
          # `prerelease: false` matches release.yml so both flows
          # target the same visibility.
          tagName: ${{ github.ref_name }}
          releaseName: 'Omnio ${{ github.ref_name }}'
          releaseBody: |
            Cross-platform installers: Windows NSIS + MSI, macOS DMG
            (arm64 + x64), Linux AppImage + deb.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
